[package]
name = "pizarra"
categories = ["graphics", "gui", "multimedia::images"]
authors = ["Abraham Toriz <categulario@gmail.com>"]
keywords = ["drawing", "presentation"]
edition = "2021"
license-file = "LICENSE"
description = "The backend for a simple vector hand-drawing application"
documentation = "https://docs.rs/pizarra"
readme = "README.md"
repository = "https://codeberg.org/categulario/pizarra"
version = "3.0.1"

[dependencies]
rstar = "0.12"
xml-rs = "0.8.26"
regex = "1.11.1"
lazy_static = "1.5.0"
log = "0.4"
serde_with = "3.12"
num-traits = "0.2"
num-derive = "0.4"
thiserror = "2.0"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dev-dependencies]
pretty_assertions = "1.4"
