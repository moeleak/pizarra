[package]
name = "pizarra"
version = "0.1.0"
authors = ["Abraham Toriz <categulario@gmail.com>"]
keywords = ["drawing", "presentation"]
edition = "2018"

[dependencies]
chrono = "0.4.11"
rstar = "0.7.1"
gdk = "0.12.0"
glib = "0.9.3"
xml-rs = "0.8.3"

[dependencies.cairo-rs]
version = "0.8.1"
features = ["svg", "png"]

[dependencies.gtk]
version = "0.8.1"
features = ["v3_22"]

[dependencies.gio]
version = ""
features = ["v2_44"]
